<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guardians of Velocity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;width:100vw}
#gameContainer{position:relative;width:100%;max-width:480px;height:100%;max-height:860px;background:#000;box-shadow:0 0 60px rgba(0,160,255,.4)}
canvas{display:block;width:100%;height:100%;background:#020208;cursor:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;color:#fff;text-shadow:0 0 6px #0ff,0 2px 4px #000}
#topBar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;font-weight:700;z-index:10;gap:6px}
#scoreBox,#livesBox,#sectorBox{background:rgba(0,15,35,.65);padding:5px 9px;border-radius:8px;border:1px solid rgba(0,220,255,.3);white-space:nowrap}
#sectorBox{color:#9df;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
#progressWrap{position:absolute;top:46px;left:10px;right:10px;height:7px;background:rgba(0,30,50,.7);border-radius:5px;overflow:hidden;z-index:10;border:1px solid rgba(0,200,255,.35)}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#a0f,#ff0);box-shadow:0 0 10px #0ff;transition:width .2s}
#checkpointLabel{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:11px;color:#8cf;opacity:.9;z-index:10}
#comboText{position:absolute;top:28%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:800;color:#ff0;text-shadow:0 0 18px #f80;opacity:0;transition:opacity .25s;z-index:15;pointer-events:none}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:40;pointer-events:auto;width:92%;max-width:360px}
#message h1{font-size:30px;color:#0ff;margin-bottom:6px;text-shadow:0 0 28px #0ff,0 0 55px #08f;letter-spacing:1px;line-height:1.15}
#message h2{font-size:18px;color:#fff;margin-bottom:10px}
#message p{font-size:13px;color:#9bd;margin:5px 0;line-height:1.45}
.btn{display:inline-block;margin-top:16px;padding:12px 30px;font-size:17px;font-weight:800;color:#000;background:linear-gradient(135deg,#0ff,#08f);border:none;border-radius:26px;cursor:pointer;pointer-events:auto;box-shadow:0 0 24px rgba(0,255,255,.55);transition:transform .12s,box-shadow .12s}
.btn:hover,.btn:active{transform:scale(1.06);box-shadow:0 0 34px rgba(0,255,255,.85)}
#velocityBar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:170px;height:9px;background:rgba(0,0,0,.55);border:2px solid #0ff;border-radius:6px;overflow:hidden;display:none;z-index:10}
#velocityFill{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#f0f)}
#powerupNotice{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);font-size:13px;color:#ff0;font-weight:700;opacity:0;transition:opacity .3s;z-index:12;text-shadow:0 0 10px #f80;white-space:nowrap}
#sectorIntro{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:800;color:#0ff;text-shadow:0 0 20px #0ff;opacity:0;transition:opacity .6s;z-index:18;pointer-events:none;text-align:center}
#touchControls{position:absolute;bottom:0;left:0;width:100%;height:105px;display:none;pointer-events:auto;z-index:25}
.touchBtn{position:absolute;width:60px;height:60px;background:rgba(0,170,255,.2);border:2px solid rgba(0,255,255,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#0ff}
#leftBtn{left:14px;bottom:20px}#rightBtn{left:86px;bottom:20px}#shootBtn{right:14px;bottom:18px;width:68px;height:68px;font-size:20px}
@media(max-width:600px){#touchControls{display:block}#message h1{font-size:24px}}
#flash{position:absolute;inset:0;background:rgba(0,255,255,.22);opacity:0;pointer-events:none;z-index:30;transition:opacity .35s}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="flash"></div>
<div id="ui">
  <div id="topBar">
    <div id="scoreBox">Score: 0</div>
    <div id="sectorBox">SECTOR 1</div>
    <div id="livesBox">❤❤❤</div>
  </div>
  <div id="progressWrap"><div id="progressFill"></div></div>
  <div id="checkpointLabel">Next Station: 300 pts</div>
  <div id="comboText">COMBO x2!</div>
  <div id="sectorIntro"></div>
  <div id="velocityBar"><div id="velocityFill"></div></div>
  <div id="powerupNotice"></div>
  <div id="message">
    <h1>GUARDIANS OF<br>VELOCITY</h1>
    <h2>Protect the Galaxy</h2>
    <p>Fly through deep space • Reach Space Stations<br>Destroy enemies • Collect power-ups<br>Survive the Velocity Storms</p>
    <p style="color:#8ef;margin-top:8px">← → or A D = Move &nbsp;|&nbsp; Space / Tap = Shoot</p>
    <button class="btn" id="startBtn">LAUNCH MISSION</button>
  </div>
</div>
<div id="touchControls">
  <div class="touchBtn" id="leftBtn">◀</div>
  <div class="touchBtn" id="rightBtn">▶</div>
  <div class="touchBtn" id="shootBtn">🔫</div>
</div>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreBox=document.getElementById('scoreBox');
const livesBox=document.getElementById('livesBox');
const sectorBox=document.getElementById('sectorBox');
const progressFill=document.getElementById('progressFill');
const checkpointLabel=document.getElementById('checkpointLabel');
const message=document.getElementById('message');
const startBtn=document.getElementById('startBtn');
const velocityBar=document.getElementById('velocityBar');
const velocityFill=document.getElementById('velocityFill');
const comboText=document.getElementById('comboText');
const powerupNotice=document.getElementById('powerupNotice');
const flashEl=document.getElementById('flash');
const sectorIntro=document.getElementById('sectorIntro');

let W,H;
function resize(){const c=document.getElementById('gameContainer');W=canvas.width=c.clientWidth;H=canvas.height=c.clientHeight}
resize();window.addEventListener('resize',resize);

// ===================== SECTORS =====================
const SECTORS=[
  {name:"Nebula Reach",     station:"Outpost Alpha",   color:"#06121f", star:"#9cf", enemyHue:145, next:300,  hazard:"none"},
  {name:"Asteroid Drift",   station:"Rockhaven Base",  color:"#151008", star:"#fc9", enemyHue:28,  next:700,  hazard:"rocks"},
  {name:"Velocity Core",    station:"Pulse Station",   color:"#14081f", star:"#f9f", enemyHue:285, next:1300, hazard:"none"},
  {name:"Plasma Storm",     station:"Storm Dock",      color:"#061816", star:"#0f9", enemyHue:165, next:2100, hazard:"none"},
  {name:"Dark Horizon",     station:"Shadow Relay",    color:"#080812", star:"#aaf", enemyHue:230, next:3200, hazard:"none"},
  {name:"Final Gate",       station:"Guardian Hub",    color:"#14050c", star:"#f77", enemyHue:0,   next:99999,hazard:"boss"}
];

// ===================== STATE =====================
let gameState='menu'; // menu | playing | docking | checkpoint | gameover
let score=0, highScore=+localStorage.getItem('gov_hs2')||0;
let lives=3, sector=0, frame=0;
let combo=0, comboTimer=0, shake=0;
let bgTint=SECTORS[0].color;
let station=null;          // active space station object
let stationApproach=false; // when score is close to next checkpoint
let asteroids=[];
let planets=[];            // background planets

const player={
  x:0,y:0,w:34,h:26,
  baseSpeed:5.7,speed:5.7,
  invincible:0,shootCD:0,
  multiShot:0,rapid:0,shield:0
};

let bullets=[],enemies=[],particles=[],powerups=[],stars=[],floatingTexts=[];

// Input
const keys={};
let touchLeft=false,touchRight=false,touchShoot=false;
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='Space'&&gameState==='playing')tryShoot();
});
window.addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('mousedown',()=>{if(gameState==='playing')tryShoot()});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(gameState==='playing')tryShoot()},{passive:false});

function setupTouch(btn,flag){
  const down=e=>{e.preventDefault();window[flag]=true};
  const up=e=>{e.preventDefault();window[flag]=false};
  btn.addEventListener('touchstart',down,{passive:false});
  btn.addEventListener('touchend',up,{passive:false});
  btn.addEventListener('mousedown',()=>window[flag]=true);
  btn.addEventListener('mouseup',()=>window[flag]=false);
  btn.addEventListener('mouseleave',()=>window[flag]=false);
}
setupTouch(document.getElementById('leftBtn'),'touchLeft');
setupTouch(document.getElementById('rightBtn'),'touchRight');
setupTouch(document.getElementById('shootBtn'),'touchShoot');
startBtn.addEventListener('click',startMission);

// Audio
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let actx=null;
function beep(freq,dur,type='square',vol=0.07){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+dur);
}

// ===================== HELPERS =====================
function initStars(){
  stars=[];
  for(let i=0;i<100;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,size:Math.random()*2.3+.3,speed:Math.random()*1.9+.2,tw:Math.random()*6.28});
  }
}
function initPlanets(){
  planets=[];
  planets.push({
    x:W*0.2+Math.random()*W*0.6, y:H*0.15+Math.random()*H*0.3,
    r:40+Math.random()*50, color:`hsl(${Math.random()*360},40%,35%)`,
    rings:Math.random()>0.5, speed:0.05+Math.random()*0.08
  });
  if(Math.random()>0.4){
    planets.push({
      x:W*0.1+Math.random()*W*0.8, y:H*0.5+Math.random()*H*0.25,
      r:25+Math.random()*35, color:`hsl(${Math.random()*360},35%,28%)`,
      rings:false, speed:0.03+Math.random()*0.05
    });
  }
}

function resetGame(){
  score=0;lives=3;sector=0;frame=0;
  combo=0;comboTimer=0;shake=0;
  bullets=[];enemies=[];particles=[];powerups=[];floatingTexts=[];
  asteroids=[];station=null;stationApproach=false;
  player.x=W/2-17;player.y=H-95;
  player.speed=player.baseSpeed;
  player.invincible=0;player.shootCD=0;
  player.multiShot=0;player.rapid=0;player.shield=0;
  velocityBar.style.display='none';
  bgTint=SECTORS[0].color;
  updateUI();
  initStars();
  initPlanets();
}

function updateUI(){
  scoreBox.textContent=`Score: ${score}`;
  livesBox.innerHTML='❤'.repeat(lives)+'♡'.repeat(Math.max(0,3-lives));
  const s=SECTORS[sector];
  sectorBox.textContent=`S${sector+1} • ${s.name}`;
  const prev=sector===0?0:SECTORS[sector-1].next;
  const target=s.next;
  const pct=Math.min(100,((score-prev)/(target-prev))*100);
  progressFill.style.width=pct+'%';
  checkpointLabel.textContent=sector<SECTORS.length-1
    ?`Next Station: ${s.station} (${target} pts)`
    :'Final Sector — Survive the Gate!';
}

function showCombo(n){
  comboText.textContent=n>=6?`MEGA COMBO x${n}!`:n>=3?`SUPER COMBO x${n}!`:`COMBO x${n}!`;
  comboText.style.opacity=1;
  setTimeout(()=>comboText.style.opacity=0,750);
}
function showPowerNotice(txt){
  powerupNotice.textContent=txt;
  powerupNotice.style.opacity=1;
  setTimeout(()=>powerupNotice.style.opacity=0,1500);
}
function flashScreen(color){
  flashEl.style.background=color||'rgba(0,255,255,.25)';
  flashEl.style.opacity=1;
  setTimeout(()=>flashEl.style.opacity=0,380);
}
function addFloat(x,y,txt,color='#ff0'){
  floatingTexts.push({x,y,txt,color,life:55,vy:-1.3});
}
function showSectorIntro(name){
  sectorIntro.innerHTML=`SECTOR ${sector+1}<br><span style="font-size:15px;color:#9cf">${name}</span>`;
  sectorIntro.style.opacity=1;
  setTimeout(()=>sectorIntro.style.opacity=0,2200);
}

// ===================== SPACE STATION =====================
function spawnStation(){
  station={
    x:W/2-70,
    y:-180,
    w:140,
    h:110,
    speed:1.6,
    lights:0,
    docked:false
  };
  stationApproach=true;
}

function drawStation(st){
  const x=st.x, y=st.y, w=st.w, h=st.h;
  ctx.save();
  // main body
  ctx.fillStyle='#2a3a4a';
  ctx.strokeStyle='#5af';
  ctx.lineWidth=2;
  // central core
  ctx.beginPath();
  ctx.roundRect(x+w*0.25,y+h*0.2,w*0.5,h*0.6,8);
  ctx.fill();ctx.stroke();
  // left module
  ctx.fillStyle='#1e2e3e';
  ctx.beginPath();
  ctx.roundRect(x,y+h*0.3,w*0.28,h*0.4,6);
  ctx.fill();ctx.stroke();
  // right module
  ctx.beginPath();
  ctx.roundRect(x+w*0.72,y+h*0.3,w*0.28,h*0.4,6);
  ctx.fill();ctx.stroke();
  // top antenna tower
  ctx.fillStyle='#3a4a5a';
  ctx.fillRect(x+w*0.45,y,w*0.1,h*0.25);
  ctx.strokeRect(x+w*0.45,y,w*0.1,h*0.25);
  // dishes
  ctx.strokeStyle='#0ff';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x+w*0.15,y+h*0.35,10,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(x+w*0.85,y+h*0.35,10,0,Math.PI*2);ctx.stroke();
  // glowing windows / lights
  st.lights+=0.08;
  for(let i=0;i<5;i++){
    const lx=x+w*0.32+i*12;
    const ly=y+h*0.35+Math.sin(st.lights+i)*3;
    ctx.fillStyle=`rgba(0,255,255,${0.5+Math.sin(st.lights+i)*0.4})`;
    ctx.fillRect(lx,ly,6,4);
  }
  for(let i=0;i<3;i++){
    ctx.fillStyle=`rgba(255,200,50,${0.4+Math.sin(st.lights*1.3+i)*0.3})`;
    ctx.beginPath();
    ctx.arc(x+w*0.35+i*25,y+h*0.7,3,0,Math.PI*2);
    ctx.fill();
  }
  // docking bay glow
  ctx.fillStyle='rgba(0,255,180,0.15)';
  ctx.fillRect(x+w*0.3,y+h*0.55,w*0.4,h*0.2);
  ctx.strokeStyle='#0fa';
  ctx.strokeRect(x+w*0.3,y+h*0.55,w*0.4,h*0.2);
  // name plate
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(x+w*0.2,y+h*0.85,w*0.6,14);
  ctx.fillStyle='#0ff';
  ctx.font='bold 10px Segoe UI,Arial';
  ctx.textAlign='center';
  ctx.fillText(SECTORS[sector].station,x+w/2,y+h*0.85+11);
  ctx.restore();
}

// ===================== ASTEROIDS =====================
function spawnAsteroid(){
  const size=20+Math.random()*28;
  asteroids.push({
    x:Math.random()*(W-size),
    y:-size-10,
    r:size,
    speed:1.1+Math.random()*1.4+sector*0.15,
    rot:Math.random()*6.28,
    rotSpeed:(Math.random()-0.5)*0.04,
    hp:Math.ceil(size/12),
    maxHp:Math.ceil(size/12)
  });
}

function drawAsteroid(a){
  ctx.save();
  ctx.translate(a.x+a.r,a.y+a.r);
  ctx.rotate(a.rot);
  ctx.fillStyle='#6a5a4a';
  ctx.strokeStyle='#9a8a7a';
  ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<7;i++){
    const ang=i/7*Math.PI*2;
    const rad=a.r*(0.75+Math.sin(i*2.1)*0.25);
    const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  // crater
  ctx.fillStyle='#4a3a2a';
  ctx.beginPath();ctx.arc(-a.r*0.2,a.r*0.1,a.r*0.25,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ===================== GAME FLOW =====================
function startMission(){
  if(!actx)actx=new AudioCtx();
  resetGame();
  gameState='playing';
  message.style.display='none';
  showSectorIntro(SECTORS[0].name);
  beep(440,0.08);beep(660,0.12);
}

function startDocking(){
  gameState='docking';
  flashScreen('rgba(0,255,200,.3)');
  beep(523,0.1);beep(659,0.1);beep(784,0.18);
  // clear most threats
  enemies=[];asteroids=[];
  if(!station)spawnStation();
  station.speed=2.2;
}

function finishCheckpoint(){
  // Rewards
  if(lives<3)lives++;
  player.invincible=140;
  player.speed=player.baseSpeed+2.8;
  velocityBar.style.display='block';
  velocityFill.style.width='100%';
  score+=80+sector*40;
  combo=0;
  station=null;
  stationApproach=false;

  const next=sector+1;
  if(next>=SECTORS.length){
    gameState='playing';
    updateUI();
    return;
  }
  const s=SECTORS[next];
  message.innerHTML=`
    <h1>SPACE STATION</h1>
    <h2>${SECTORS[sector].station}</h2>
    <p style="color:#8ef">Docking complete</p>
    <p>+1 Life restored<br>+Velocity systems recharged<br>+Supply bonus points</p>
    <p style="margin-top:8px;color:#9cf">Next: Sector ${next+1} — ${s.name}</p>
    <button class="btn" id="continueBtn">CONTINUE MISSION →</button>
  `;
  message.style.display='block';
  gameState='checkpoint';
  document.getElementById('continueBtn').onclick=()=>{
    sector=next;
    bgTint=SECTORS[sector].color;
    initPlanets();
    enemies=[];asteroids=[];
    updateUI();
    message.style.display='none';
    gameState='playing';
    showSectorIntro(SECTORS[sector].name);
    beep(880,0.1);
  };
}

function gameOver(){
  gameState='gameover';
  if(score>highScore){highScore=score;localStorage.setItem('gov_hs2',highScore)}
  message.innerHTML=`
    <h1>MISSION FAILED</h1>
    <h2>Score: ${score}</h2>
    <p>High Score: ${highScore}</p>
    <p>Reached Sector ${sector+1}<br>${SECTORS[sector].name}</p>
    <button class="btn" id="restartBtn">RETRY MISSION</button>
  `;
  message.style.display='block';
  document.getElementById('restartBtn').onclick=startMission;
  beep(160,0.35,'sawtooth',0.1);
}

// ===================== COMBAT =====================
function tryShoot(){
  if(player.shootCD>0)return;
  player.shootCD=player.rapid>0?6:11;
  const shots=player.multiShot>0?3:1;
  const spread=player.multiShot>0?13:0;
  for(let i=0;i<shots;i++){
    const offset=shots===1?0:(i-1)*spread;
    bullets.push({
      x:player.x+player.w/2-2+offset,
      y:player.y-6,
      w:4,h:11,speed:13.5,
      color:player.multiShot>0?'#f0f':'#0ff'
    });
  }
  for(let i=0;i<4;i++){
    particles.push({x:player.x+player.w/2,y:player.y,vx:(Math.random()-0.5)*3,vy:-Math.random()*4-1,life:12,color:'#0ff'});
  }
  beep(900+Math.random()*80,0.035,'square',0.045);
}

function spawnEnemy(){
  const s=SECTORS[sector];
  const r=Math.random();
  const base=1.35+sector*0.32+Math.min(score/1400,2.2);
  let e;
  if(r<0.48){
    e={x:Math.random()*(W-30),y:-40,w:28,h:24,speed:base+Math.random()*1.3,hp:1,maxHp:1,type:'normal',color:`hsl(${s.enemyHue+Math.random()*40},75%,55%)`};
  }else if(r<0.72){
    e={x:Math.random()*(W-24),y:-30,w:22,h:18,speed:base+2.6+Math.random()*1.6,hp:1,maxHp:1,type:'fast',color:'#f4f'};
  }else if(r<0.88){
    e={x:Math.random()*(W-40),y:-48,w:36,h:30,speed:base*0.65,hp:3+Math.floor(sector/2),maxHp:3+Math.floor(sector/2),type:'tank',color:'#fa3'};
  }else{
    e={x:Math.random()*(W-30),y:-36,w:30,h:26,speed:base*0.8,hp:2,maxHp:2,type:'shooter',color:'#f55',shootCD:50+Math.random()*40};
  }
  enemies.push(e);
}

function spawnPowerup(x,y){
  if(Math.random()>0.34)return;
  const types=['velocity','multi','rapid','shield'];
  const t=Math.random()<0.4?'velocity':types[Math.floor(Math.random()*types.length)];
  powerups.push({x:x-11,y:y-11,w:22,h:22,speed:2.0,type:t});
}

function explode(x,y,color,n=14){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*4.5+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:16+Math.random()*18,color});
  }
}

// ===================== UPDATE =====================
function update(){
  if(gameState!=='playing'&&gameState!=='docking')return;
  frame++;

  // Stars
  stars.forEach(s=>{
    s.y+=s.speed*(1+sector*0.07);
    s.tw+=0.05;
    if(s.y>H){s.y=-4;s.x=Math.random()*W}
  });

  // Planets drift slowly
  planets.forEach(p=>{p.y+=p.speed;if(p.y>H+p.r){p.y=-p.r*2;p.x=Math.random()*W}});

  // Player
  let dir=0;
  if(keys['ArrowLeft']||keys['KeyA']||touchLeft)dir=-1;
  if(keys['ArrowRight']||keys['KeyD']||touchRight)dir=1;
  player.x+=dir*player.speed;
  player.x=Math.max(3,Math.min(W-player.w-3,player.x));
  if(touchShoot&&frame%(player.rapid>0?7:12)===0)tryShoot();
  if(player.shootCD>0)player.shootCD--;
  if(player.invincible>0)player.invincible--;
  if(player.multiShot>0)player.multiShot--;
  if(player.rapid>0)player.rapid--;
  if(player.shield>0)player.shield--;

  if(player.speed>player.baseSpeed){
    player.speed-=0.011;
    if(player.speed<=player.baseSpeed){player.speed=player.baseSpeed;velocityBar.style.display='none'}
    else velocityFill.style.width=Math.min(100,((player.speed-player.baseSpeed)/4.5)*100)+'%';
  }
  if(comboTimer>0){comboTimer--;if(comboTimer===0)combo=0}
  if(shake>0)shake*=0.87;

  // Station approach logic
  if(gameState==='playing'&&sector<SECTORS.length-1){
    const target=SECTORS[sector].next;
    if(score>=target-80&&!stationApproach&&!station){
      spawnStation();
    }
    if(score>=target&&stationApproach){
      startDocking();
    }
  }

  // Station movement
  if(station){
    station.y+=station.speed;
    station.lights+=0.1;
    if(gameState==='docking'){
      // slow player toward station center
      const targetX=station.x+station.w/2-player.w/2;
      player.x+=(targetX-player.x)*0.04;
      if(station.y+station.h*0.6>player.y-10){
        finishCheckpoint();
      }
    }else if(station.y>H+50){
      station=null;stationApproach=false;
    }
  }

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.y-=b.speed;
    if(b.y<-25||b.y>H+25)bullets.splice(i,1);
  }

  // Spawn enemies
  if(gameState==='playing'){
    const spawnEvery=Math.max(15,46-sector*4-Math.floor(score/350));
    if(frame%spawnEvery===0)spawnEnemy();
    // Asteroids in asteroid sector or randomly
    if((SECTORS[sector].hazard==='rocks'||Math.random()<0.008)&&frame%40===0)spawnAsteroid();
  }

  // Enemies
  for(let ei=enemies.length-1;ei>=0;ei--){
    const e=enemies[ei];
    e.y+=e.speed;
    if(e.type==='fast')e.x+=Math.sin(frame*0.09+ei)*1.35;
    if(e.type==='shooter'){
      e.shootCD--;
      if(e.shootCD<=0&&e.y>15&&e.y<H*0.55){
        bullets.push({x:e.x+e.w/2-2,y:e.y+e.h,w:4,h:10,speed:-5.8,color:'#f55',enemy:true});
        e.shootCD=65+Math.random()*45;
      }
    }
    if(e.y>H+50){enemies.splice(ei,1);continue}

    // hit player
    if(gameState==='playing'&&player.invincible<=0&&player.shield<=0&&
       e.x<player.x+player.w&&e.x+e.w>player.x&&e.y<player.y+player.h&&e.y+e.h>player.y){
      hitPlayer();enemies.splice(ei,1);continue;
    }

    // bullets vs enemy
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      if(b.enemy)continue;
      if(b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){
        e.hp--;bullets.splice(bi,1);
        explode(b.x,b.y,e.color,5);
        if(e.hp<=0){
          const pts=e.type==='tank'?38:e.type==='fast'?24:e.type==='shooter'?30:13;
          const gained=pts+Math.floor(combo*2.5);
          score+=gained;combo++;comboTimer=95;
          if(combo>=2)showCombo(combo);
          addFloat(e.x+e.w/2,e.y,`+${gained}`,'#ff0');
          explode(e.x+e.w/2,e.y+e.h/2,e.color,17);
          spawnPowerup(e.x+e.w/2,e.y+e.h/2);
          enemies.splice(ei,1);
          updateUI();
          beep(620+Math.random()*180,0.05,'square',0.055);
          break;
        }
      }
    }
  }

  // Enemy bullets
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];
    if(!b.enemy)continue;
    b.y-=b.speed;
    if(b.y>H+20){bullets.splice(bi,1);continue}
    if(gameState==='playing'&&player.invincible<=0&&player.shield<=0&&
       b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){
      hitPlayer();bullets.splice(bi,1);
    }
  }

  // Asteroids
  for(let ai=asteroids.length-1;ai>=0;ai--){
    const a=asteroids[ai];
    a.y+=a.speed;a.rot+=a.rotSpeed;
    if(a.y>H+a.r*2){asteroids.splice(ai,1);continue}
    // player collision
    if(gameState==='playing'&&player.invincible<=0&&player.shield<=0){
      const dx=(a.x+a.r)-(player.x+player.w/2);
      const dy=(a.y+a.r)-(player.y+player.h/2);
      if(dx*dx+dy*dy<(a.r+14)*(a.r+14)){
        hitPlayer();asteroids.splice(ai,1);continue;
      }
    }
    // bullets
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      if(b.enemy)continue;
      const dx=(a.x+a.r)-(b.x+2),dy=(a.y+a.r)-(b.y+5);
      if(dx*dx+dy*dy<a.r*a.r){
        a.hp--;bullets.splice(bi,1);
        explode(b.x,b.y,'#ca8',4);
        if(a.hp<=0){
          score+=18+Math.floor(a.r/2);
          addFloat(a.x+a.r,a.y,`+${18+Math.floor(a.r/2)}`,'#fc8');
          explode(a.x+a.r,a.y+a.r,'#ca8',12);
          // split if big
          if(a.r>22){
            for(let k=0;k<2;k++){
              asteroids.push({
                x:a.x+Math.random()*10,y:a.y+Math.random()*10,
                r:a.r*0.55,speed:a.speed*1.15,
                rot:Math.random()*6,rotSpeed:(Math.random()-0.5)*0.06,
                hp:1,maxHp:1
              });
            }
          }
          asteroids.splice(ai,1);
          updateUI();
          break;
        }
      }
    }
  }

  // Powerups
  for(let pi=powerups.length-1;pi>=0;pi--){
    const p=powerups[pi];
    p.y+=p.speed;
    if(p.y>H){powerups.splice(pi,1);continue}
    if(p.x<player.x+player.w&&p.x+p.w>player.x&&p.y<player.y+player.h&&p.y+p.h>player.y){
      applyPowerup(p.type);
      explode(p.x+11,p.y+11,'#ff0',10);
      powerups.splice(pi,1);score+=10;updateUI();
    }
  }

  // Particles & floats
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];f.y+=f.vy;f.life--;
    if(f.life<=0)floatingTexts.splice(i,1);
  }
}

function hitPlayer(){
  lives--;player.invincible=105;shake=14;
  explode(player.x+player.w/2,player.y+player.h/2,'#f55',22);
  combo=0;updateUI();
  beep(170,0.28,'sawtooth',0.11);
  if(lives<=0)gameOver();
}

function applyPowerup(type){
  beep(740,0.09,'sine',0.09);
  if(type==='velocity'){
    player.speed=Math.min(player.speed+3.3,player.baseSpeed+5.8);
    velocityBar.style.display='block';velocityFill.style.width='100%';
    showPowerNotice('⚡ VELOCITY BOOST!');
  }else if(type==='multi'){
    player.multiShot=380;showPowerNotice('✦ TRIPLE SHOT!');
  }else if(type==='rapid'){
    player.rapid=420;showPowerNotice('🔥 RAPID FIRE!');
  }else if(type==='shield'){
    player.shield=320;player.invincible=Math.max(player.invincible,40);
    showPowerNotice('🛡 ENERGY SHIELD!');
  }
}

// ===================== DRAW =====================
function draw(){
  // bg
  ctx.fillStyle=bgTint;
  ctx.fillRect(0,0,W,H);
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'rgba(0,0,0,0.1)');
  grd.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  ctx.save();
  if(shake>0.4)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // Distant planets
  planets.forEach(p=>{
    ctx.globalAlpha=0.55;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    if(p.rings){
      ctx.strokeStyle='rgba(200,180,120,0.35)';
      ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.6,p.r*0.35,0.3,0,Math.PI*2);ctx.stroke();
    }
    // subtle highlight
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath();ctx.arc(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // Stars
  const starCol=SECTORS[sector].star;
  stars.forEach(s=>{
    const a=0.3+Math.sin(s.tw)*0.3+s.size*0.12;
    ctx.globalAlpha=a;
    ctx.fillStyle=starCol;
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  if(gameState==='menu'){ctx.restore();return}

  // Asteroids
  asteroids.forEach(drawAsteroid);

  // Space Station
  if(station)drawStation(station);

  // Player
  if(player.invincible<=0||Math.floor(frame/3)%2===0){
    drawShip(player.x,player.y,player.w,player.h);
    if(player.shield>0){
      ctx.strokeStyle=`rgba(0,255,255,${0.35+Math.sin(frame*0.18)*0.25})`;
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,27,0,Math.PI*2);ctx.stroke();
    }
  }

  // Bullets
  bullets.forEach(b=>{
    ctx.fillStyle=b.color||'#0ff';
    ctx.shadowBlur=7;ctx.shadowColor=b.color||'#0ff';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.shadowBlur=0;
  });

  // Enemies
  enemies.forEach(e=>{
    if(e.type==='normal')drawAlien(e);
    else if(e.type==='fast')drawFast(e);
    else if(e.type==='tank')drawTank(e);
    else drawShooter(e);
    if(e.maxHp>1){
      const pct=e.hp/e.maxHp;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.fillRect(e.x,e.y-9,e.w,4);
      ctx.fillStyle=pct>0.5?'#0f0':'#f80';
      ctx.fillRect(e.x,e.y-9,e.w*pct,4);
    }
  });

  // Powerups
  powerups.forEach(p=>{
    ctx.save();
    ctx.translate(p.x+11,p.y+11);
    ctx.rotate(frame*0.09);
    if(p.type==='velocity'){
      ctx.fillStyle='#ff0';ctx.shadowBlur=12;ctx.shadowColor='#ff0';
      ctx.beginPath();ctx.moveTo(-5,-11);ctx.lineTo(5,-3);ctx.lineTo(1,-3);ctx.lineTo(7,11);ctx.lineTo(-3,3);ctx.lineTo(1,3);ctx.closePath();ctx.fill();
    }else if(p.type==='multi'){
      ctx.fillStyle='#f0f';ctx.shadowBlur=10;ctx.shadowColor='#f0f';
      for(let i=-1;i<=1;i++)ctx.fillRect(i*7-2,-8,4,16);
    }else if(p.type==='rapid'){
      ctx.fillStyle='#f80';ctx.shadowBlur=10;ctx.shadowColor='#f80';
      ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,4);ctx.lineTo(0,0);ctx.lineTo(-8,4);ctx.closePath();ctx.fill();
    }else{
      ctx.strokeStyle='#0ff';ctx.lineWidth=3;ctx.shadowBlur=10;ctx.shadowColor='#0ff';
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.restore();
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=Math.min(1,p.life/18);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,2.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // Floating texts
  floatingTexts.forEach(f=>{
    ctx.globalAlpha=f.life/55;
    ctx.fillStyle=f.color;
    ctx.font='bold 15px Segoe UI,Arial';
    ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y);
    ctx.globalAlpha=1;
  });

  ctx.restore();
}

function drawShip(x,y,w,h){
  ctx.save();ctx.translate(x+w/2,y+h/2);
  ctx.fillStyle='#0ff';ctx.shadowBlur=14;ctx.shadowColor='#0ff';
  ctx.beginPath();ctx.moveTo(0,-h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(0,h/3.2);ctx.lineTo(-w/2,h/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-3,4.5,0,Math.PI*2);ctx.fill();
  const glow=6+Math.sin(frame*0.35)*3;
  ctx.fillStyle='#f70';
  ctx.beginPath();ctx.moveTo(-5,h/2-1);ctx.lineTo(0,h/2+glow);ctx.lineTo(5,h/2-1);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}
function drawAlien(e){
  ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);
  ctx.fillStyle=e.color;ctx.shadowBlur=7;ctx.shadowColor=e.color;
  ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-3,3.8,0,Math.PI*2);ctx.arc(6,-3,3.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-6,-3,1.8,0,Math.PI*2);ctx.arc(6,-3,1.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=e.color;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(-7,-e.h/2+2);ctx.lineTo(-11,-e.h/2-5);ctx.moveTo(7,-e.h/2+2);ctx.lineTo(11,-e.h/2-5);ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
}
function drawFast(e){
  ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);
  ctx.fillStyle=e.color;ctx.shadowBlur=11;ctx.shadowColor=e.color;
  ctx.beginPath();ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,e.h/2);ctx.lineTo(0,e.h/4);ctx.lineTo(-e.w/2,e.h/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,0,255,0.35)';
  ctx.beginPath();ctx.moveTo(-3,e.h/2);ctx.lineTo(0,e.h/2+11);ctx.lineTo(3,e.h/2);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}
function drawTank(e){
  ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);
  ctx.fillStyle=e.color;ctx.shadowBlur=9;ctx.shadowColor=e.color;
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2;const px=Math.cos(a)*e.w/2,py=Math.sin(a)*e.h/2;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}
function drawShooter(e){
  ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);
  ctx.fillStyle=e.color;ctx.shadowBlur=8;ctx.shadowColor=e.color;
  ctx.beginPath();ctx.moveTo(0,-e.h/2);ctx.lineTo(e.w/2,0);ctx.lineTo(0,e.h/2);ctx.lineTo(-e.w/2,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#faa';ctx.fillRect(-3,e.h/2-2,6,8);
  ctx.shadowBlur=0;ctx.restore();
}

// Loop
function loop(){update();draw();requestAnimationFrame(loop)}
initStars();initPlanets();
player.x=W/2-17;player.y=H-95;
loop();
</script>
